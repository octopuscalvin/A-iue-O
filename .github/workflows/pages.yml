# 每次 push 去 main，自動建置並發佈去 GitHub Pages
# 網址：https://octopuscalvin.github.io/A-iue-O/
name: 發佈網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 建置（網站喺 /A-iue-O/ 底下；VRM 模型授權唔准轉發，所以網上版唔包）
        run: npm run build
        env:
          PAGES_BASE: /A-iue-O/
          VITE_HAS_VRM: 'false'
      - name: 移除 VRM 模型檔
        run: rm -rf dist/models
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
